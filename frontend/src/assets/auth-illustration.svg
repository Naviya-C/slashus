<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An open book whose pages rise into a network of connected nodes">
  <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">

    <!-- edges: knowledge graph -->
    <g stroke-width="1.4" stroke-opacity="0.5">
      <path d="M200 204 L200 150" />
      <path d="M200 150 L152 96" />
      <path d="M200 150 L248 96" />
      <path d="M152 96 L110 58" />
      <path d="M152 96 L200 42" />
      <path d="M248 96 L292 60" />
      <path d="M248 96 L200 42" />
      <path d="M110 58 L200 42" />
      <path d="M200 42 L292 60" />
    </g>

    <g stroke-width="1.2" stroke-opacity="0.28" stroke-dasharray="4 6">
      <path d="M152 96 L72 110" />
      <path d="M72 110 L110 58" />
      <path d="M248 96 L328 112" />
      <path d="M328 112 L292 60" />
    </g>

    <!-- nodes -->
    <circle cx="200" cy="150" r="7" fill="#ffffff" stroke="none" />
    <circle cx="152" cy="96" r="5.5" fill="#ffffff" stroke="none" />
    <circle cx="248" cy="96" r="5.5" fill="#ffffff" stroke="none" />
    <circle cx="200" cy="42" r="5" stroke-width="1.6" />
    <circle cx="110" cy="58" r="4.5" stroke-width="1.6" />
    <circle cx="292" cy="60" r="4.5" stroke-width="1.6" />
    <circle cx="72" cy="110" r="3.5" stroke-width="1.4" stroke-opacity="0.6" />
    <circle cx="328" cy="112" r="3.5" stroke-width="1.4" stroke-opacity="0.6" />

    <!-- open book -->
    <g stroke-width="2">
      <path d="M200 214 C176 198 132 192 92 196 L92 238 C132 234 176 240 200 256 Z" />
      <path d="M200 214 C224 198 268 192 308 196 L308 238 C268 234 224 240 200 256 Z" />
      <path d="M200 214 L200 256" />
    </g>

    <!-- text lines on pages -->
    <g stroke-width="1.3" stroke-opacity="0.45">
      <path d="M110 208 C136 206 166 212 186 221" />
      <path d="M110 220 C136 218 166 224 186 233" />
      <path d="M290 208 C264 206 234 212 214 221" />
      <path d="M290 220 C264 218 234 224 214 233" />
    </g>

  </g>
