[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "piliwela"
version = "0.1.0"
description = "High-performance Sinhala legacy font converter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = [
    "sinhala",
    "unicode",
    "legacy-font",
    "fmabhaya",
    "pdf"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[tool.maturin]
features = ["pyo3/extension-module"]