[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slashus-ingestion-service"
version = "1.0.0"
description = "Streaming, multi-format document ingestion worker for Slashus"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "confluent-kafka>=2.6,<3",
  "fastapi>=0.115,<1",
  "google-auth[requests]>=2.40.3,<3",
  "google-cloud-storage>=2.18,<4",
  "openpyxl>=3.1,<4",
  "piliwela>=0.1.0,<1",
  "Pillow>=10,<13",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pymupdf>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "redis>=5,<7",
  "structlog>=24,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
vision = ["google-genai>=1,<2"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
ingestion-service = "ingestion_service.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
packages = ["ingestion_service"]
ignore_missing_imports = true
