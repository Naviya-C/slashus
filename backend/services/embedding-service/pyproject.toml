[project]
name = "embedding-service"
version = "4.0.0"
description = "Sinhala hybrid-retrieval embedding and vector-search service"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "confluent-kafka>=2.6,<3.0",
    "qdrant-client>=1.12,<2.0",
    # ONNX Runtime rather than sentence-transformers/torch: far smaller image,
    # lower resident memory, faster CPU inference, explicit thread control.
    "fastembed>=0.5.0",
    "grpcio>=1.68,<2.0",
    "grpcio-health-checking>=1.68,<2.0",
    "grpcio-reflection>=1.68,<2.0",
    "protobuf>=5.28,<6.0",
    "structlog>=24.4,<26.0",
    "prometheus-client>=0.21,<1.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28,<2.0",
    "mmh3>=5.0,<6.0",
    "tenacity>=9.0,<10.0",
    "typer>=0.15,<1.0",
    "redis>=5.2,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0","pytest-asyncio>=0.24,<1.0","pytest-cov>=6.0,<7.0",
       "grpcio-tools>=1.68,<2.0","ruff>=0.8,<1.0","mypy>=1.13,<2.0"]

[project.scripts]
embedding-service = "embedding_service.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embedding_service"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src","tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","C4","SIM","RUF","ASYNC","S","T20"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/embedding_service/proto_gen/*" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["proto_gen"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*","qdrant_client.*","fastembed.*","mmh3.*","grpc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
