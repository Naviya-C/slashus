// search.proto — the contract between agentic-service and embedding-service.
//
// This file is DUPLICATED, byte for byte, in both repositories:
//
//     embedding-service/proto/search.proto
//     agentic-service/proto/search.proto
//
// Copying rather than sharing a module is deliberate at seven services: a
// shared proto package means a version bump has to land in both before either
// can deploy. Two copies and an additive-only rule means each side deploys
// independently. `scripts/check_proto.sh` fails if they drift.
//
// ADDITIVE ONLY. Never renumber a field and never reuse a number. Both
// services run in production and are deployed separately, so at any moment an
// old client is talking to a new server or the reverse.
//
// v2 additions (all optional, all backwards compatible):
//   SearchRequest.filters       content filters — lesson_title, page_number
//   Hit.dense_rank/.sparse_rank which leg surfaced a hit, for diagnostics
//   SearchResponse.total_user_chunks / .filters_applied
//   rpc ListTitles              the real lesson titles, for closed-set matching

syntax = "proto3";

package slashus.search.v1;

// ---------------------------------------------------------------------------

enum SearchMode {
  SEARCH_MODE_HYBRID = 0;
  SEARCH_MODE_DENSE = 1;
  SEARCH_MODE_SPARSE = 2;
}

enum EmbedPurpose {
  EMBED_PURPOSE_QUERY = 0;
  EMBED_PURPOSE_DOCUMENT = 1;
}

// A filter value is always a LIST, even when it has one element.
//
// map<string, string> would have been simpler, but it cannot express
// `doc_id IN (a, b, c)` — and expressing that as three separate conditions on
// the same key is precisely the bug this contract exists to prevent: Qdrant
// ANDs them, matches nothing, and returns success.
message FilterValues {
  repeated string values = 1;
}

// ---------------------------------------------------------------------------

message SearchRequest {
  string query = 1;

  // Ownership. Typed fields rather than entries in `filters` so the server can
  // reject a search that omits them — Qdrant has no concept of ownership, and
  // a query without user_id returns every user's chunks.
  string user_id = 2;
  repeated string doc_ids = 3;

  int32 limit = 4;
  SearchMode mode = 5;
  string language = 6;

  // CONTENT filters: lesson_title, page_number, block_type. Distinct from the
  // ownership fields above because the server drops these on request and
  // never drops those.
  //
  // A content filter that matches nothing excludes EVERYTHING, and Qdrant
  // reports that as a successful empty result. The caller owns the recovery
  // (see agentic-service agents/retrieval/agent.py), which is why the
  // response echoes back which keys were applied.
  map<string, FilterValues> filters = 7;
}

message Hit {
  string chunk_id = 1;
  float score = 2;
  string content = 3;
  string title = 4;
  int32 page = 5;
  string doc_id = 6;

  // "semantic", "sparse", or "semantic+sparse".
  string source = 7;

  // Everything not promoted to a typed field, as strings. A map keeps payload
  // additions from requiring a stub regeneration in two services.
  map<string, string> extra = 8;

  // Rank within each leg before fusion. 0 means that leg did not return it.
  // Diagnostics: "why is this ranked here?" is otherwise unanswerable from a
  // fused score alone.
  int32 dense_rank = 9;
  int32 sparse_rank = 10;
}

message SearchResponse {
  repeated Hit hits = 1;
  string collection_used = 2;
  string language_used = 3;

  // TRUE means the user has indexed nothing at all — a different message in
  // the UI from "searched and matched nothing". Carried explicitly rather
  // than inferred from an empty hit list.
  bool user_has_no_documents = 4;

  // Chunks this user owns, from the existence check the server already runs.
  int32 total_user_chunks = 5;

  // The content filter keys actually applied. Lets the caller distinguish
  // "the filter excluded everything" from "the server ignored my filter".
  repeated string filters_applied = 6;
}

// ---------------------------------------------------------------------------
// Closed-set title listing.
//
// Asking a model to produce a lesson_title from nothing yields a plausible
// title rather than a real one, and the filter then matches zero chunks. This
// returns the EXACT stored strings so the caller can pick from them instead.

message ListTitlesRequest {
  string user_id = 1;
  repeated string doc_ids = 2;
  int32 limit = 3;
}

message TitleInfo {
  string title = 1;
  int32 chunk_count = 2;
}

message ListTitlesResponse {
  repeated TitleInfo titles = 1;
  int32 total_chunks = 2;

  // The scan hit its page cap. The list is still usable, just incomplete —
  // worth knowing before concluding a title "does not exist".
  bool truncated = 3;
}

// ---------------------------------------------------------------------------

message EmbedRequest {
  repeated string texts = 1;

  // Explicit because query and document embedding are one method call apart
  // and mixing them degrades retrieval with no error anywhere.
  EmbedPurpose purpose = 2;
}

message DenseVector {
  repeated float values = 1;
}

message SparseVector {
  repeated uint32 indices = 1;
  repeated float values = 2;
}

message EmbedResponse {
  repeated DenseVector dense = 1;
  repeated SparseVector sparse = 2;
}

message HealthRequest {}

message HealthResponse {
  bool ready = 1;
  string detail = 2;

  // sha256 prefix of sparse_vocab.json. If the caller ever caches anything
  // vocab-derived, comparing hashes turns silent drift into a visible
  // mismatch.
  string vocab_hash = 3;
}

// ---------------------------------------------------------------------------

service VectorSearch {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ListTitles(ListTitlesRequest) returns (ListTitlesResponse);
  rpc Embed(EmbedRequest) returns (EmbedResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
