services:

  ########################################
  # Caddy — TLS termination, the ONLY service published to the host.
  # Obtains and renews a Let's Encrypt certificate for api.slashus.com
  # automatically. Requires the DNS A record to resolve to this VM BEFORE
  # first start, or the ACME challenge fails and Caddy retries in a loop.
  ########################################
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"     # needed for the ACME HTTP challenge and the HTTPS redirect
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume Caddy re-requests a
      # certificate on every restart and will hit Let's Encrypt's rate limit
      # (5 per domain per week) surprisingly fast.
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - api-gateway
    restart: unless-stopped

  ########################################
  # Redis — gateway rate limiting (db 0) + auth login lockout (db 1)
  ########################################
  redis:
    image: redis:8-alpine
    container_name: redis
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ########################################
  # Kafka (KRaft, single node)
  ########################################
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - ./data/kafka:/tmp/kraft-combined-logs
    healthcheck:
      # CHANGED: was kafka-broker-api-versions.sh, which spawns a full JVM on
      # every probe. On a small VM that cold start regularly exceeded the 10s
      # timeout and the probe was killed before the broker could answer —
      # which is what made `up` fail with "dependency kafka failed to start"
      # even though the broker had logged "Kafka Server started".
      # bash's /dev/tcp opens a socket with no process spawn: milliseconds.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Gives the broker time to boot before failures start counting against
      # the retry budget. Its absence was the other half of that failure.
      start_period: 40s
    restart: unless-stopped
    # No `ports:` on purpose — only Caddy is reachable from outside the VM.
    # Everything else talks over the internal compose network by service name.

  ########################################
  # Kafka topic initialization (runs once, then exits)
  ########################################
  kafka-setup:
    image: apache/kafka:4.1.0
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic documents.uploaded --partitions 1 --replication-factor 1 &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic documents.chunks --partitions 1 --replication-factor 1 &&
          echo 'Topics created' &&
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  ########################################
  # Auth Service (Go) — Neon Postgres, RS256 tokens
  ########################################
  auth-service:
    build:
      context: ./services/auth-service
    container_name: auth-service
    env_file:
      - ./services/auth-service/.env
    environment:
      REDIS_URL: redis://redis:6379/1
    volumes:
      # ADDED: the RSA signing key. Generate it once on the VM:
      #   mkdir -p secrets
      #   openssl genrsa -out secrets/jwt-private.pem 2048
      #   chmod 600 secrets/jwt-private.pem
      #
      # And set an ABSOLUTE path in services/auth-service/.env:
      #   JWT_PRIVATE_KEY_FILE=/etc/slashus/private.pem
      #
      # The crash was `./etc/slashus/private.pem` — the leading dot makes it
      # relative to the container's working directory, where nothing exists.
      #
      # Back this file up. Losing it invalidates every outstanding token.
      # It must never reach git; ./secrets/ is already gitignored.
      - ./secrets/jwt-private.pem:/etc/slashus/private.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8081"
    restart: unless-stopped
    # No local `postgres` container: DATABASE_URL points at Neon (managed,
    # external). A local one would start, pass its healthcheck, and never be
    # talked to — wasted RAM on a small VM.

  ########################################
  # API Gateway (Go) — now behind Caddy, not published to the host
  ########################################
  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: api-gateway
    env_file:
      - ./services/api-gateway/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      AUTH_URL: http://auth-service:8081
      UPLOAD_URL: http://upload-service:8002
      INGESTION_URL: http://ingestion-service:8003
      # The agentic (RAG/chat) service isn't in this repo yet, so
      # /chat, /mark and /history will 502 until it's built and added here.
      AGENTIC_URL: http://agentic:8084
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy
    expose:
      - "8080"
    # CHANGED: was `ports: ["8080:8080"]`. Caddy reaches this over the internal
    # compose network, so there's no reason to publish it to the host — and
    # your firewall now only allows 80/443 anyway. Publishing it would leave a
    # plaintext HTTP entrypoint bypassing TLS.
    #
    # To debug from inside the VM, use `docker compose exec` or temporarily
    # re-add `ports: ["127.0.0.1:8080:8080"]` — bound to loopback only.
    restart: unless-stopped

  ########################################
  # Upload Service (Python/FastAPI)
  ########################################
  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
      # Context is the repo root because this Dockerfile COPYs
      # shared/contracts and shared/storage, which live above the service dir.
    container_name: upload-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    env_file:
      - ./services/upload-service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MESSAGE_PROVIDER: kafka
    expose:
      - "8002"
    volumes:
      - ./data/uploads:/data/uploads
    restart: unless-stopped
    # If this is still crash-looping: GOOGLE_APPLICATION_CREDENTIALS must be
    # DELETED from services/upload-service/.env, not pointed at a path. The
    # VM's attached service account supplies GCS credentials via the metadata
    # server; that variable overrides it and looks for a file that isn't there.

  ########################################
  # Ingestion Service (Python)
  ########################################
  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion-service/Dockerfile
    container_name: ingestion-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    env_file:
      - ./services/ingestion-service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_TOPIC: documents.uploaded
      CHUNKS_TOPIC: documents.chunks
      INGESTION_GROUP: ingestion
    volumes:
      - ./data/uploads:/data/uploads
    expose:
      - "8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # /health is liveness only. GET /jobs/{id} via the gateway still 502s:
    # job-status tracking needs a shared store and isn't built yet.

  ########################################
  # Embedding Service (Python) — SINGLE REPLICA ONLY
  ########################################
  embedding-service:
    build:
      context: .
      dockerfile: services/embedding-service/Dockerfile
    container_name: embedding-service
    depends_on:
      kafka:
        condition: service_healthy
      kafka-setup:
        condition: service_completed_successfully
    env_file:
      - ./services/embedding-service/.env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHUNKS_TOPIC: documents.chunks
      EMBEDDING_GROUP: embedding
    volumes:
      - ./data/sparse_vocab:/app/_store
      - ./data/huggingface:/home/appuser/.cache/huggingface
    expose:
      - "8004"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Never scale past 1: the sparse encoder writes a shared vocab file and
    # is single-writer. /health does not probe Qdrant.